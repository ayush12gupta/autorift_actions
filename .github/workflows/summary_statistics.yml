# Summary statistics over all velocity maps of a run
name: summary_statistics
run-name: summary_statistics

on:
  workflow_dispatch:
    inputs:
        run_id:
            type: string
            required: false
            description: run ID of the batch run whose velocity maps to summarize (blank = this run)
            default: ''
  workflow_call:

jobs:
    summary_statistics:
        name: summary_statistics
        runs-on: ubuntu-latest
        permissions:
            contents: write
            actions: read
        defaults:
            run:
                shell: bash -el {0}

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Install Conda environment with Micromamba
              uses: mamba-org/setup-micromamba@v2
              with:
                cache-environment: true
                environment-file: environment.yml
                environment-name: image-correlation

            - name: Download Velocity Map Artifacts
              uses: actions/download-artifact@v4
              with:
                  path: velocity_maps
                  merge-multiple: true
                  run-id: ${{ inputs.run_id || github.run_id }}
                  github-token: ${{ github.token }}

            - name: Compute Summary Statistics
              run: |
                python -u scripts/s2_summary_statistics.py velocity_maps

            - name: Upload Summary Statistics Figure as Artifact
              uses: actions/upload-artifact@v4
              with:
                name: summary_statistics
                path: |
                    velocity_summary_statistics.png

            - name: Upload Summary Rasters as Artifact
              uses: actions/upload-artifact@v4
              with:
                name: summary_velocity_maps
                path: |
                    median_*.tif
                    stdev_*.tif
                    count_*.tif

            - name: Commit summary outputs to a results branch
              run: |
                mkdir -p results/${{ inputs.run_id || github.run_id }}
                cp velocity_summary_statistics.png median_*.tif stdev_*.tif count_*.tif results/${{ inputs.run_id || github.run_id }}/
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add results
                git commit -m "Summary statistics for run ${{ inputs.run_id || github.run_id }}"
                git push origin HEAD:refs/heads/results/run-${{ inputs.run_id || github.run_id }}
